name: Release crate

on:
  workflow_dispatch:
  push:
    tags:
      - '*'

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      
      - name: Login
        run: cargo login ${{ secrets.CARGO_LOGIN_TOKEN }}
      - name: Publish crate
        run: cargo publish

